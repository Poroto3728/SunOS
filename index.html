<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SunOS</title>
<style>
:root{--wall:linear-gradient(135deg,#1b2a4a,#6b3fa0);--win:#f4f5f8;--tx:#16181d;--bar:#ffffffd9;--bd:#0003;--ac:#3b82f6;--tile:#ffffff38;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--win:#23262d;--tx:#eceef2;--bar:#14161bd9;--bd:#fff3}}
:root[data-theme="dark"]{--win:#23262d;--tx:#eceef2;--bar:#14161bd9;--bd:#fff3}
html{background:var(--wall) fixed}
html,body{margin:0;height:100%;overflow:hidden}
body{background:transparent;font:var(--fs,14px)/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;color:var(--tx);-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#os{position:relative;height:100%;overflow:hidden}
#ic{position:absolute;top:40px;left:12px;height:calc(100% - 120px);display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:10px}
#ic button{width:84px;background:none;border:0;color:#fff;text-shadow:0 1px 4px #000a;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px}
.tile{width:54px;height:54px;border-radius:14px;background:var(--tile);backdrop-filter:blur(8px);display:grid;place-items:center;font-size:28px}
#ic em{font-style:normal;font-size:12px}
.w{position:absolute;background:var(--win);border-radius:var(--rad,10px);box-shadow:0 12px 34px #0007;border:1px solid var(--bd);display:flex;flex-direction:column;min-width:220px;overflow:hidden}
.w.mx{inset:32px 0 50px 0!important;width:auto!important;height:auto!important;border-radius:0}
.tb{display:flex;align-items:center;gap:10px;padding:7px 10px;cursor:grab;touch-action:none;font-weight:600;border-bottom:1px solid var(--bd)}
.tb b{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;gap:6px;order:-1}
.ctl button{width:16px;height:16px;border:0;border-radius:50%;padding:0;font-size:0;background:#999}
.ctl .x{background:#ef4444}.ctl .m{background:#eab308}.ctl .z{background:#22c55e}
[data-os="win"] .ctl{order:2;gap:0}
[data-os="win"] .ctl button{width:32px;height:24px;border-radius:4px;background:none;font-size:13px;line-height:1}
[data-os="win"] .ctl .x:hover{background:#ef4444;color:#fff}
.bd{flex:1;min-height:0;overflow:auto;-webkit-user-select:text;user-select:text}
.tm{background:#0d1117;color:#c9f7d0;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;padding:8px;cursor:text}
.tm pre{margin:0;white-space:pre-wrap;font:inherit}
.tm label{display:flex;gap:6px}.tm input{flex:1;background:none;border:0;color:inherit;font:inherit;min-width:0}
textarea{width:100%;height:100%;box-sizing:border-box;border:0;resize:none;padding:10px;background:transparent;color:inherit;font:inherit}
.fl{padding:8px;display:grid;gap:4px;align-content:start}
.fl button{text-align:left;background:none;border:0;padding:8px;border-radius:6px}
.fl button:hover,.st button:hover{background:var(--bd)}
.cc{padding:10px;display:flex;flex-direction:column;gap:8px}
.cc output{display:block;text-align:right;font-size:28px;padding:8px;background:var(--bd);border-radius:8px;min-height:1.4em;overflow:hidden}
.cc div{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cc button{padding:12px 0;border:0;border-radius:8px;background:var(--bd);font-size:17px}
.cc button:nth-child(4n){background:var(--ac);color:#fff}
.st{padding:12px}.st h4{margin:10px 0 6px}
.st button{margin:0 6px 6px 0;padding:6px 12px;border:1px solid var(--bd);border-radius:8px;background:none}
#bar{position:absolute;left:0;right:0;bottom:0;height:44px;z-index:99990;background:var(--bar);backdrop-filter:blur(16px);display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--tx)}
#bar button{border:0;background:none;border-radius:8px;padding:6px 10px;display:flex;gap:6px;align-items:center}
#bar button:hover,#bar .on{background:var(--bd)}
#tasks{display:flex;gap:4px;flex:1;overflow:hidden}
#tasks em{font-style:normal}
#ck{margin-left:auto;padding:0 6px}
[data-os="linux"] #bar{top:0;bottom:auto;height:30px}
[data-os="linux"] #ic{top:44px}
[data-os="linux"] .w.mx{inset:30px 0 0 0!important}
[data-os="ios"] #bar{left:50%;right:auto;transform:translateX(-50%);bottom:10px;height:62px;width:max-content;max-width:94%;border-radius:24px;padding:0 12px}
[data-os="ios"] #tasks em,[data-os="ios"] #st em,[data-os="ios"] #ck{display:none}
[data-os="ios"] #ic{top:44px;left:0;right:0;height:auto;flex-direction:row;justify-content:center;gap:18px}
[data-os="ios"] .w{border-radius:18px}
.sn{text-align:center;padding:8px;outline:0}.sn canvas{max-width:100%;border-radius:8px}.sn p{margin:6px}
.sn div button,.ck2 button,.pt button{margin:2px;padding:6px 12px;border:1px solid var(--bd);border-radius:8px;background:none}
.pt{display:flex;flex-direction:column}.pt div{display:flex;gap:8px;align-items:center;padding:6px}.pt canvas{width:100%;flex:1;min-height:0;touch-action:none;cursor:crosshair}
.pn{display:flex;gap:4px;padding:10px;height:100%;box-sizing:border-box;outline:0}
.pn button{flex:1;background:#fff;color:#111;border:1px solid #0004;border-radius:0 0 8px 8px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;padding-bottom:10px}
.pn small{opacity:.5}
.ck2{text-align:center;padding:12px}.ck2 h2{font-size:34px;margin:8px}.ck2 output{display:block;font:30px ui-monospace,Menlo,Consolas,monospace;margin:8px}
.sh>div{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--bd)}.sh p{flex:1;margin:0;font-size:13px}.sh .tile{width:44px;height:44px;font-size:24px;background:var(--bd)}
.sh button,.mn div button,.td button,.dc button,.mm>button{padding:6px 12px;border:1px solid var(--bd);border-radius:8px;background:none}
.mn div{padding:8px;display:flex;gap:6px;align-items:center}.mn section{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;padding:0 8px 8px}
.mn section button{aspect-ratio:1;border:0;border-radius:4px;background:var(--ac);color:#fff;font-weight:700;padding:0}.mn section .o{background:var(--bd);color:var(--tx)}
.mm{text-align:center;padding:8px}.mm section{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.mm section button{aspect-ratio:1;border:0;border-radius:10px;background:var(--ac);font-size:26px}.mm section .u{background:var(--bd)}
.td>div{display:flex;gap:6px;padding:8px}.td>div input{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;background:transparent;color:inherit}
.td ul{list-style:none;margin:0;padding:0 10px}.td li{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}.td li span{flex:1}.td .dn{text-decoration:line-through;opacity:.5}
.dc{text-align:center;padding:14px}.dc output{display:block;font-size:54px}.dc button{margin:2px}
#wd{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#fff;text-shadow:0 2px 14px #0009;pointer-events:none}
#wd b{display:block;font-size:64px;font-weight:300;line-height:1}#wd span{font-size:18px}
.st input[type="text"]{padding:6px 8px;border:1px solid var(--bd);border-radius:8px;background:transparent;color:inherit;width:60%}
.st input[type="range"]{width:80%}.st input[type="file"]{font-size:12px;max-width:100%}
.ff{display:flex;flex-direction:column;height:100%}
.fa{display:flex;gap:2px;padding:6px 6px 0;background:var(--bd);overflow-x:auto}
.fa button{display:flex;gap:8px;align-items:center;border:0;border-top:2px solid transparent;border-radius:8px 8px 0 0;background:none;padding:6px 10px;max-width:170px;min-width:60px}
.fa button span{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fa button.on{background:var(--win);border-top-color:#ff7139}.fa i{font-style:normal;opacity:.6}
.fb{display:flex;gap:4px;padding:6px;align-items:center}.fb button{border:0;background:none;border-radius:6px;padding:4px 8px}.fb button:hover{background:var(--bd)}
.fb input{flex:1;min-width:0;border-radius:20px;border:1px solid var(--bd);padding:6px 14px;background:var(--bd);color:inherit;font:inherit}
.fp{flex:1;overflow:auto;-webkit-user-select:text;user-select:text}
.pc{padding:24px 20px;max-width:560px;margin:0 auto;text-align:center}.pc h1{margin:12px 0 16px;font-size:34px}.pc a{color:var(--ac)}
.pc .sb{width:100%;box-sizing:border-box;padding:10px 16px;border-radius:24px;border:1px solid var(--bd);background:var(--bd);color:inherit;font:inherit}
.tl{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:22px}.tl button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:6px;width:84px}.tl .tile{background:var(--bd)}
.w{animation:pop .15s ease-out}@keyframes pop{from{opacity:0;transform:scale(.94)}}
.w.cl{opacity:0;transform:scale(.94);transition:opacity .13s,transform .13s}
.w:not(.fw) .tb{opacity:.6}
#ic .sel{background:#ffffff30;border-radius:8px}
#tr{margin-left:auto;display:flex;gap:10px;align-items:center;padding:0 6px;font-size:13px}
[data-os="ios"] #tr{display:none}
#sm .pw{border-top:1px solid var(--bd);border-radius:0 0 8px 8px}
#cm{position:absolute;z-index:99999;min-width:180px;background:var(--bar);backdrop-filter:blur(16px);border:1px solid var(--bd);border-radius:10px;padding:4px;display:none;color:var(--tx)}
#cm button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px}#cm button:hover{background:var(--bd)}
#nt{position:absolute;top:40px;right:12px;z-index:99996;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.nt{background:var(--bar);backdrop-filter:blur(16px);border:1px solid var(--bd);padding:10px 14px;border-radius:12px;color:var(--tx);max-width:260px;animation:pop .2s}
#lk{position:absolute;inset:0;z-index:999000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;text-shadow:0 2px 12px #0008;background:linear-gradient(#0006,#0006),var(--wall);transition:opacity .4s;outline:0;cursor:pointer}
#lk.off{opacity:0;pointer-events:none}#lk b{font-size:84px;font-weight:300;line-height:1}#lk span{font-size:18px}

.tk{padding:10px}.tk p{margin:0 0 8px;font-family:ui-monospace,Menlo,Consolas,monospace}.tk ul{list-style:none;margin:0;padding:0}

.tk h5{margin:12px 0 4px;font-size:12px;opacity:.7}.tk table{width:100%;border-collapse:collapse;font-size:12px}
.tk th{text-align:left;position:sticky;top:0;background:var(--win);padding:4px 6px;border-bottom:1px solid var(--bd)}.tk td{padding:3px 6px;border-bottom:1px solid var(--bd)}
.tk td small{display:block;opacity:.6}.tk td:nth-child(n+2),.tk th:nth-child(n+2){text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.sv{display:flex;flex-direction:column;height:100%;background:#1b2838;color:#c7d5e0}
.sv nav{display:flex;align-items:center;gap:4px;background:#171a21;padding:0 10px}.sv nav b{letter-spacing:.15em;margin-right:12px;color:#fff}

.sv nav span{margin-left:auto;font-size:12px;color:#66c0f4}.sv main{flex:1;min-height:0;overflow:auto}.sv footer{background:#171a21;font-size:12px;padding:6px 12px;color:#8f98a0}

.sv .b2{background:#32465a;color:#8f98a0;border:0;border-radius:3px;padding:8px 14px}
.sx{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;padding:14px}

.sc{padding:14px}.sc .me{display:flex;align-items:center;gap:10px}.sc .me b{font-size:18px;color:#fff}

.sc li{display:flex;gap:10px;align-items:baseline;padding:6px 10px;border-left:3px solid #4c5560;margin-bottom:4px;background:#16202d}

.ck3{text-align:center;padding:14px}.ck3 button{font-size:84px;background:none;border:0}.ck3 output{display:block;font-size:20px}

.gm{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#000b;color:#fff;text-align:center}

.gm button{padding:10px 26px;border:0;border-radius:6px;background:linear-gradient(#7bd,#38a);color:#fff;font-weight:700}.gm label{display:block;text-align:left;font-size:13px}
.gx{padding:10px;text-align:center;outline:0}.gx p{margin:6px 0}.gx h4{margin:8px 0}

.pqg{display:grid;grid-template-columns:repeat(10,1fr);gap:1px;background:var(--bd);max-width:340px;margin:0 auto}.pqg div{aspect-ratio:1;background:var(--win);display:grid;place-items:center;font-size:20px}

 const mv=d=>{if(over)return;p=[cl(p[0]+d[0],W),cl(p[1]+d[1],H)];check()};
 const init=()=>{p=[0,0];over=0;gm=Array.from({length:5},rn);en=Array.from({length:3},()=>[3+(Math.random()*(W-3)|0),Math.random()*H|0]);draw()};
 bs.forEach((b,i)=>b.onclick=()=>i<4?mv(D[i]):init());
 el.onkeydown=e=>{const i=['ArrowLeft','ArrowUp','ArrowDown','ArrowRight'].indexOf(e.key);if(i>=0){e.preventDefault();mv(D[i])}};
 const iv=setInterval(()=>{if(!el.isConnected){clearInterval(iv);return}if(over)return;en=en.map(([a,b])=>{const d=D[Math.random()*4|0];return[cl(a+d[0],W),cl(b+d[1],H)]});check()},600);
 init();el.focus();
}
function racers(el){
 el.classList.add('gx');el.tabIndex=0;
 el.innerHTML='<canvas width="300" height="360"></canvas><p></p>';
 const c=el.querySelector('canvas'),x=c.getContext('2d'),p=el.querySelector('p');
 let lane=1,ob=[],dist=0,spd=4,dead=0;
 const reset=()=>{lane=1;ob=[];dist=0;spd=4;dead=0};
 const move=d=>{if(dead){reset();return}lane=Math.max(0,Math.min(2,lane+d))};
 c.onpointerdown=e=>{const r=c.getBoundingClientRect();move(e.clientX<r.left+r.width/2?-1:1)};
 el.onkeydown=e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)};
 const f=()=>{
  if(!el.isConnected)return;
  if(!dead){
   dist+=spd/10;spd=4+dist/60;
   if(Math.random()<.03+spd/400)ob.push({l:Math.random()*3|0,y:-40});
   ob.forEach(o=>{o.y+=spd});ob=ob.filter(o=>o.y<380);
   if(ob.some(o=>o.l===lane&&o.y>260&&o.y<320))dead=1;
  }
  x.fillStyle='#333';x.fillRect(0,0,300,360);
  x.fillStyle='#fff';for(let i=1;i<3;i++)for(let y=-((dist*10)%40);y<360;y+=40)x.fillRect(i*100-2,y,4,20);
  x.font='34px serif';x.textAlign='center';
  ob.forEach(o=>x.fillText('🚧',o.l*100+50,o.y+30));
  x.fillText('🏎️',lane*100+50,320);
  p.textContent=dead?'¡Chocaste! '+Math.floor(dist)+' m — toca para reiniciar':Math.floor(dist)+' m · toca izquierda o derecha';
  requestAnimationFrame(f);
 };
 f();el.focus();
}
function miner(el){
 el.classList.add('gx');
 let ore=0,pc=1,ps=0,c1=10,c2=25;
 el.innerHTML='<output></output><button class="big" aria-label="Minar">☄️</button><div class="up"><button></button><button></button></div>';
 const o=el.querySelector('output'),[u1,u2]=el.querySelectorAll('.up button');
 const r=()=>{o.textContent='⛏️ Mineral: '+Math.floor(ore)+' · +'+pc+' por toque · +'+ps+'/s';u1.textContent='Taladro mejorado (+1 por toque) — '+c1;u2.textContent='Dron minero (+1 por segundo) — '+c2};
 el.querySelector('.big').onclick=()=>{ore+=pc;r()};
 u1.onclick=()=>{if(ore>=c1){ore-=c1;pc++;c1=Math.ceil(c1*1.6);r()}};
 u2.onclick=()=>{if(ore>=c2){ore-=c2;ps++;c2=Math.ceil(c2*1.7);r()}};
 const iv=setInterval(()=>{if(!el.isConnected){clearInterval(iv);return}ore+=ps;r()},1000);
 r();
}
function zombies(el){
 el.classList.add('gx');
 el.innerHTML='<p></p><section class="zf"><span class="hs">🏠</span></section>';
 const p=el.querySelector('p'),f=el.querySelector('section');
 let Z=[],hp=5,sc=0,sp=0;
 const upd=()=>{p.textContent=hp>0?'🏠 '+'❤️'.repeat(hp)+'   Zombis eliminados: '+sc:'💀 Perdiste con '+sc+' zombis — toca la casa para reiniciar'};
 f.querySelector('.hs').onclick=()=>{if(hp<=0){Z.forEach(z=>z.e.remove());Z=[];hp=5;sc=0;upd()}};
 const iv=setInterval(()=>{
  if(!el.isConnected){clearInterval(iv);return}
  if(hp<=0)return;
  if(++sp%18===0){
   const a=Math.random()*6.283,z={x:50+55*Math.cos(a),y:50+55*Math.sin(a),e:hm('button','zb','🧟')};
   z.e.style.left=z.x+'%';z.e.style.top=z.y+'%';
   z.e.onclick=()=>{z.dead=1;z.e.remove();sc++;upd()};
   f.append(z.e);Z.push(z);
  }
  Z.forEach(z=>{
   if(z.dead)return;
   const dx=50-z.x,dy=50-z.y,d=Math.hypot(dx,dy);
   if(d<7){z.dead=1;z.e.remove();hp--;upd();return}
   z.x+=dx/d*.7;z.y+=dy/d*.7;z.e.style.left=z.x+'%';z.e.style.top=z.y+'%';
  });
  Z=Z.filter(z=>!z.dead);
 },50);
 upd();
}
function cubes(el){
 el.classList.add('gx');
 const C=[['Hierba','#5aa02c'],['Tierra','#8b5a2b'],['Piedra','#8a8f98'],['Madera','#c8923c'],['Agua','#3b82f6'],['Borrar','']];
 let cur=0;
 el.innerHTML='<div class="pl"></div><section class="cbg"></section><button>Limpiar</button>';
 const pl=el.querySelector('.pl'),g=el.querySelector('section'),cells=[];
 const pb=C.map(([n,c],i)=>{
  const b=hm('button','',null,()=>{cur=i;pb.forEach((x,j)=>x.classList.toggle('on',j===i))}),s=hm('i');
  s.style.background=c||'transparent';b.append(s,n);pl.append(b);return b;
 });
 pb[0].classList.add('on');
 for(let i=0;i<140;i++){const c=hm('div'),paint=()=>{c.style.background=C[cur][1]};c.onpointerdown=paint;c.onpointerenter=e=>{if(e.buttons)paint()};g.append(c);cells.push(c)}
 el.querySelector(':scope>button').onclick=()=>cells.forEach(c=>{c.style.background=''});

function cats(el){
 el.classList.add('gx');
 const MN=[['🐀 Rata',20,3],['🦇 Murciélago',28,4],['🐉 Dragón',45,6]],R=n=>Math.random()*n|0;
 let hp,pot,k,mh,end,log;
 el.innerHTML='<h4></h4><p></p><div class="ac"><button>⚔️ Atacar</button><button>🛡️ Defender</button><button>🧪 Poción</button></div><small></small>';
 const h=el.querySelector('h4'),p=el.querySelector('p'),s=el.querySelector('small'),bs=el.querySelectorAll('.ac button');
 const draw=()=>{const m=MN[Math.min(k,2)];h.textContent='🐱 '+hp+' ❤️   vs   '+m[0]+' '+Math.max(0,mh);p.textContent=log;s.textContent='Pociones: '+pot+' · Monstruo '+(Math.min(k,2)+1)+'/3'};
 const init=()=>{hp=30;pot=2;k=0;mh=MN[0][1];end=0;log='¡Aparece '+MN[0][0]+'!';draw()};
 const turn=a=>{
  if(end){init();return}
  let guard=0;log='';
  if(a===0){const d=3+R(6);mh-=d;log='Atacas y haces '+d+' de daño. '}
  else if(a===1){guard=1;log='Te proteges. '}
  else if(pot>0){pot--;hp=Math.min(30,hp+12);log='Usas una poción (+12). '}
  else{log='No te quedan pociones.';draw();return}
  if(mh<=0){k++;if(k>2){end=1;log+='¡Ganaste! 🏆 Toca un botón para jugar otra vez.';draw();return}mh=MN[k][1];hp=Math.min(30,hp+6);log+='Derrotaste al monstruo. Ahora: '+MN[k][0]+'.';draw();return}
  let d=MN[k][2]+R(3);if(guard)d=Math.ceil(d/2);hp-=d;log+='El monstruo te hace '+d+' de daño.';
  if(hp<=0){hp=0;end=1;log+=' 💀 Perdiste. Toca un botón para reintentar.'}
  draw();
 };
 bs.forEach((b,i)=>b.onclick=()=>turn(i));
 init();
}
function sunedge(el){el.classList.add('se');firefox(el)}
function bin(el){
 el.classList.add('fl');
 const draw=()=>{
  el.innerHTML='<div class="fb2"><button>Vaciar papelera</button></div><ul></ul>';
  el.querySelector('button').onclick=()=>{TR=[];tsave();draw()};
  const ul=el.querySelector('ul');
  if(!TR.length){const p=document.createElement('p');p.textContent='La papelera está vacía.';el.append(p)}
  TR.forEach((t,i)=>{
   const li=document.createElement('li'),r=document.createElement('button'),x=document.createElement('button');
   li.textContent=(isD(t.v)?'📁 ':'📄 ')+t.n;
   r.textContent='Restaurar';r.onclick=()=>{FT[t.n in FT?t.n+' (restaurado)':t.n]=t.v;TR.splice(i,1);fsave();tsave();draw()};
   x.textContent='Eliminar';x.onclick=()=>{TR.splice(i,1);tsave();draw()};
   li.append(r,x);ul.append(li);
  });
 };
 draw();
}
function boot(){
 document.querySelectorAll('.w,.t').forEach(x=>x.remove());
 $('#sm').classList.remove('open');
 $('#lk').classList.remove('off');
 const b=$('#boot'),i=b.querySelector('i');
 b.classList.remove('off');i.style.animation='none';void i.offsetWidth;i.style.animation='';
 setTimeout(()=>b.classList.add('off'),1900);
}
const E={};
function addApp(id){
 const a=apps[id],d=document.createElement('button');
 d.innerHTML='<span class="tile">'+a.i+'</span><em>'+a.n+'</em>';d.onclick=matchMedia('(pointer:fine)').matches?()=>{document.querySelectorAll('#ic .sel').forEach(x=>x.classList.remove('sel'));d.classList.add('sel')}:()=>open(id);d.ondblclick=()=>open(id);d.onkeydown=e=>{if(e.key==='Enter')open(id)};$('#ic').append(d);
 const m=document.createElement('button');m.textContent=a.i+'  '+a.n;m.onclick=()=>open(id);$('#sm').insertBefore(m,$('#sm').querySelector('.pw'));E[id]=[d,m];
}
Object.keys(apps).forEach(addApp);
const rb=document.createElement('button');rb.textContent='🔄  Reiniciar';rb.onclick=boot;$('#sm').append(rb);
const lb=document.createElement('button');lb.className='pw';lb.textContent='🔒  Bloquear';lb.onclick=()=>{$('#sm').classList.remove('open');$('#lk').classList.remove('off');$('#lk').focus()};$('#sm').insertBefore(lb,rb);
const save=()=>{try{localStorage.setItem('gos_i',JSON.stringify(Object.keys(apps).filter(x=>shop[x])))}catch(e){}};
function install(id){if(apps[id])return;apps[id]=shop[id];addApp(id);save();notify('Instalada: '+shop[id].n)}
function uninstall(id){delete apps[id];E[id].forEach(x=>x.remove());delete E[id];save()}
try{JSON.parse(localStorage.getItem('gos_i')||'[]').forEach(id=>shop[id]&&install(id))}catch(e){}
const P={os:'win',theme:'',wall:'linear-gradient(135deg,#1b2a4a,#6b3fa0)',ac:'#3b82f6',rad:10,font:14,icons:1,wd:1,h24:1,cur:1,snd:0,name:'gaby'},D={...P};
try{Object.assign(P,JSON.parse(localStorage.getItem('gos_p')||'{}'))}catch(e){}
function apply(){
 B.dataset.os=P.os;
 if(P.theme)R.dataset.theme=P.theme;else delete R.dataset.theme;
 const s=R.style;s.setProperty('--wall',P.wall);s.setProperty('--ac',P.ac);s.setProperty('--rad',P.rad+'px');s.setProperty('--fs',P.font+'px');
 if(P.cur)delete R.dataset.cur;else R.dataset.cur='off';
 $('#ic').style.display=P.icons?'':'none';$('#wd').style.display=P.wd?'':'none';$('#hi').textContent='Hola, '+P.name;$('#ln').textContent=P.name;
 tick();
 const q={...P};if(q.wall.startsWith('url'))delete q.wall;
 try{localStorage.setItem('gos_p',JSON.stringify(q))}catch(e){}
}
$('#st').onclick=e=>{e.stopPropagation();$('#sm').classList.toggle('open')};
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#sm,#st'))$('#sm').classList.remove('open')});
const tick=()=>document.querySelectorAll('.clk').forEach(c=>c.textContent=new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:!P.h24}));
const sys=()=>{tick();const n=new Date();$('#dt').textContent=n.toLocaleDateString('es-AR');$('#ld').textContent=n.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})};
sys();setInterval(sys,20000);

addEventListener('online',net);addEventListener('offline',net);net();
$('#vl').onclick=()=>{window.MUTE=!window.MUTE;$('#vl').textContent=window.MUTE?'🔇':'🔊'};
try{navigator.getBattery().then(b=>{const u=()=>{$('#bt2').textContent=(b.charging?'⚡':'🔋')+Math.round(b.level*100)+'%'};u();b.onlevelchange=u;b.onchargingchange=u}).catch(()=>{})}catch(e){}
const cm=$('#cm');
[['🖥️ Abrir Terminal',()=>open('term')],['📝 Nueva nota',()=>open('notes','')],['⚙️ Personalizar',()=>open('set')],['🔄 Actualizar',()=>notify('Escritorio actualizado')]].forEach(([t,f])=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{cm.style.display='none';f()};cm.append(b)});
$('#os').addEventListener('contextmenu',e=>{if(e.target.closest('.w,#bar,#sm,#lk,#boot'))return;e.preventDefault();cm.style.display='block';cm.style.left=Math.min(e.clientX,innerWidth-190)+'px';cm.style.top=Math.min(e.clientY,innerHeight-190)+'px'});

setTimeout(()=>lk.focus(),2000);
addEventListener('keydown',e=>{
 if(e.key==='Escape'){$('#sm').classList.remove('open');cm.style.display='none'}
 else if(e.ctrlKey&&e.key.toLowerCase()==='l'){e.preventDefault();$('#sm').classList.remove('open');lk.classList.remove('off');lk.focus()}
 else if(e.altKey&&(e.key==='Tab'||e.key==='j')){

 }
});
apply();
setTimeout(()=>$('#boot').classList.add('off'),1900);
